<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карта мифических существ Средиземноморья</title>

    <!-- Leaflet CSS (обязательно до JS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Наши стили -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Заголовок поверх карты -->

        <h1>Мифические существа Средиземноморья</h1>

    <!-- Контейнер карты (Leaflet сам найдёт его по id) -->

        <span>Кликните на карту, чтобы узнать координаты (для отладки)</span>

    <!-- Leaflet JS -->

    <!-- ⚠️ Описания ОБЯЗАТЕЛЬНО до script.js -->
